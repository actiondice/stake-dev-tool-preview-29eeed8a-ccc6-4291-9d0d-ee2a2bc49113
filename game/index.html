      (function () {
        function showBootError(message) {
          var panel = document.getElementById("boot-error");
          if (!panel) return;
          panel.style.display = "block";
          panel.textContent += message + "\n\n";
        }

        window.addEventListener("error", function (event) {
          showBootError(
            "ERROR: " +
              (event.message || "Unknown error") +
              "\n" +
              (event.filename || "") +
              ":" +
              (event.lineno || 0) +
              ":" +
              (event.colno || 0)
          );
        });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          showBootError(
            "PROMISE: " +
              (reason && (reason.stack || reason.message)
                ? reason.stack || reason.message
                : String(reason))
          );
        });
      })();
    </script>

    <script>
      (function () {
        var loader = document.getElementById("wvz-studio-loader");
        var logo = document.getElementById("wvz-studio-logo");
        if (!loader || !logo) return;

        var frames = 99;
        var fps = 30;
        var holdMs = 0;
        var start = performance.now();
        var frameUrls = [];
        for (var i = 0; i < frames; i++) {
          frameUrls.push(
            "./assets/ui/studio_loading/exact_frames_v2/studio_logo_frame_" +
              String(i).padStart(3, "0") +
              ".png"
          );
        }
        frameUrls.forEach(function (url) {
          var img = new Image();
          img.src = url;
        });

        function setFrame(frame) {
          logo.src = frameUrls[frame];
        }

        function finish() {
          loader.classList.add("done");
          window.__wvzStudioLoaderDone = true;
          window.dispatchEvent(new Event("wvz-studio-loader-done"));
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 300);
        }

        function tick(now) {
          var elapsed = now - start;
          var frame = Math.min(frames - 1, Math.floor(elapsed / 1000 * fps));
          setFrame(frame);
          if (frame >= frames - 1 && elapsed > frames / fps * 1000 + holdMs) {
            finish();
            return;
          }
          requestAnimationFrame(tick);
        }

        setFrame(0);
        requestAnimationFrame(tick);
        setTimeout(finish, 6500);
        window.__wvzSkipStudioLoader = finish;
      })();
    </script>
    <script>
      (function () {
        var loader = document.getElementById("wvz-game-loader");
        var stage = document.getElementById("wvz-game-loader-stage");
        if (!loader) return;

        var done = false;
        var ready = false;
        var started = false;
        var loadedFragment = false;
        var studioDone = !!window.__wvzStudioLoaderDone;

        function scaleStage() {
          if (!stage) return;
          var w = window.innerWidth || document.documentElement.clientWidth || loader.clientWidth || 1920;
          var h = window.innerHeight || document.documentElement.clientHeight || loader.clientHeight || 1080;
          if (w < 100 || h < 100) {
            setTimeout(scaleStage, 100);
            return;
          }
          var scale = Math.min(w / 1920, h / 1080);
          stage.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
        }

        function setReady() {
          ready = true;
          var loadingState = document.getElementById("wvz-exact-loading-state");
          var readyState = document.getElementById("wvz-exact-ready-state");
          if (loadingState) loadingState.style.display = "none";
          if (readyState) readyState.style.display = "";
        }

        function startExactLoader() {
          if (started || !loadedFragment || !studioDone) return;
          started = true;
          var fill = document.getElementById("wvz-exact-fill");
          var pct = document.getElementById("wvz-exact-percent");
          var duration = 4000;
          var start = performance.now();
          function tick(now) {
            if (done || ready) return;
            var progress = Math.min(100, ((now - start) / duration) * 100);
            if (fill) fill.style.width = progress + "%";
            if (pct) pct.textContent = String(Math.round(progress));
            if (progress >= 100) {
              setTimeout(setReady, 350);
              return;
            }
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        }

        window.addEventListener("wvz-studio-loader-done", function () {
          studioDone = true;
          startExactLoader();
        });

        function nativeLoaderGone() {
          return !document.querySelector(".loading-screen.svelte-b2pzx6");
        }

        function hideNativeLoader() {
          document.body.classList.add("wvz-hide-native-loader");
          document.querySelectorAll(".loading-screen.svelte-b2pzx6").forEach(function (el) {
            el.style.opacity = "0";
            el.style.pointerEvents = "none";
            el.style.visibility = "hidden";
          });
        }

        function removeExactLoader() {
          loader.classList.add("done");
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 320);
        }

        function finish() {
          if (done) return;
          if (!studioDone || !ready) return;
          done = true;
          hideNativeLoader();
          var tries = 0;
          var waitForGame = setInterval(function () {
            tries++;
            hideNativeLoader();
            if (nativeLoaderGone() || tries > 120) {
              clearInterval(waitForGame);
              removeExactLoader();
            }
          }, 100);
        }

        if (stage) {
          var template = document.getElementById("wvz-game-loader-template");
          if (template) {
            stage.innerHTML = template.innerHTML;
          } else {
            stage.innerHTML = '<div style="position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#fff;font:700 34px Arial">Loading</div>';
          }
          loadedFragment = true;
          scaleStage();
          startExactLoader();
        }

        scaleStage();
        var resizeTries = 0;
        var resizeBurst = setInterval(function () {
          scaleStage();
          resizeTries++;
          if (resizeTries > 30 || done) clearInterval(resizeBurst);
        }, 100);
        window.addEventListener("resize", scaleStage);
        loader.addEventListener("click", finish);
      })();
    </script>

    <script>
      (function(){

        // Fix paytable container layout - Svelte reactively resets justify-content:center
        // Using setProperty with 'important' to beat Svelte's style updates
        setInterval(function(){
          var modal = document.querySelector('.container.svelte-mymgq0');
          if(!modal) return;
          modal.style.setProperty('justify-content', 'flex-start', 'important');
          modal.style.setProperty('align-items', 'flex-start', 'important');
          modal.style.setProperty('padding', '0', 'important');
        }, 50);

        // Intercept paytable scroll restoration with MutationObserver
        // Targets both container AND panel since panel is the actual scroll element
        (function(){
          var _scrollLock = null;
          function lockScrollTop(el) {
            if(!el) return;
            el.scrollTop = 0;
            function onScroll() { el.scrollTop = 0; }
            el.addEventListener('scroll', onScroll, {passive:false});
            clearTimeout(_scrollLock);
            _scrollLock = setTimeout(function(){
              el.removeEventListener('scroll', onScroll);
            }, 600);
          }
          function lockPaytable(root) {
            // Lock both the container and the inner panel (the actual scrollable element)
            var container = root.classList && root.classList.contains('container') && root.classList.contains('svelte-mymgq0') ? root
              : root.querySelector && root.querySelector('.container.svelte-mymgq0');
            if(!container) return;
            lockScrollTop(container);
            var panel = container.querySelector('.panel.svelte-mymgq0');
            if(panel) lockScrollTop(panel);
          }

          var obs = new MutationObserver(function(muts){
            muts.forEach(function(m){
              m.addedNodes.forEach(function(node){
                if(node.nodeType === 1) lockPaytable(node);
              });
            });
          });
          obs.observe(document.body, {childList:true, subtree:true});

          // Also poll every 80ms for the first 600ms after panel appears, in case
          // Svelte restores scroll position asynchronously after mount
          var _pollTimer = null;

            var panel = document.querySelector('.panel.svelte-mymgq0');

            // Any click that opens the paytable â†’ start a short polling burst
            clearInterval(_pollTimer);

  <script>
  // WVZ: autoplay should continue through bonuses unless this toggle is enabled.
  (function(){
    if (window.__wvzAutoSpinFix31) return;
    window.__wvzAutoSpinFix31 = true;

    function visible(el){
      if (!el) return false;
      var r = el.getBoundingClientRect();
      var s = window.getComputedStyle(el);
      return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
    }

    function readStopAfterBonus(){
      return localStorage.getItem('wvzStopAutoAfterBonus') === '1';
    }

    function writeStopAfterBonus(on){
      window.__wvzStopAutoAfterBonus = !!on;
      localStorage.setItem('wvzStopAutoAfterBonus', on ? '1' : '0');
    }

    function updateToggle(btn){
      var on = readStopAfterBonus();
      window.__wvzStopAutoAfterBonus = on;
      if (!btn) return;
      btn.classList.toggle('is-on', on);
      btn.textContent = on ? 'STOP IF BONUS WON: ON' : 'STOP IF BONUS WON: OFF';
    }

    function installToggle(){
      var panel = document.querySelector('.panel.svelte-1p454xu .panel-content.svelte-1p454xu');
      if (!panel || document.getElementById('wvz-auto-stop-bonus')) return;
      var btn = document.createElement('button');
      btn.id = 'wvz-auto-stop-bonus';
      btn.type = 'button';
      btn.className = 'wvz-auto-stop-bonus';
      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        writeStopAfterBonus(!readStopAfterBonus());
        updateToggle(btn);
      });
      updateToggle(btn);
      var start = panel.querySelector('.start-btn.svelte-1p454xu');
      panel.insertBefore(btn, start || null);
    }

    function hasActiveAutoBadge(){
      var badge = document.querySelector('.auto-count-badge.svelte-148rkou, .auto-count-badge');
      if (!visible(badge)) return false;
      var t = (badge.textContent || '').trim();
      return t === '∞' || t === 'âˆž' || /\d/.test(t);
    }

    var lastAutoSeen = 0;
    window.__wvzAutoLockUntil = window.__wvzAutoLockUntil || 0;

    document.addEventListener('click', function(e){
      if (e.target && e.target.closest && e.target.closest('.start-btn.svelte-1p454xu')) {
        lastAutoSeen = Date.now();
        window.__wvzAutoLockUntil = Date.now() + 6500;
        document.body.classList.add('wvz-autospin-active');
      }
      if (e.target && e.target.closest && e.target.closest('.continue-btn.svelte-1bdh0t9')) {
        window.__wvzAutoLockUntil = 0;
      }
    }, true);

    writeStopAfterBonus(readStopAfterBonus());
    setInterval(function(){
      installToggle();
      var popup = document.querySelector('.sheet.svelte-1bdh0t9');
      var active = hasActiveAutoBadge();
      if (active) {
        lastAutoSeen = Date.now();
        window.__wvzAutoLockUntil = Date.now() + 6500;
      }
      if (visible(popup)) {
        active = false;
        window.__wvzAutoLockUntil = 0;
      }
      document.body.classList.toggle('wvz-autospin-active', active || Date.now() < (window.__wvzAutoLockUntil || 0) || Date.now() - lastAutoSeen < 6500);
    }, 120);
  })();

  <script>
  // WVZ: keep base WIN hidden at zero and keep controls calm while the spin is locked.
  (function(){
    if (window.__wvzHudGuard32) return;
    window.__wvzHudGuard32 = true;

    function visible(el){
      if (!el) return false;
      var r = el.getBoundingClientRect();
      var s = window.getComputedStyle(el);
      return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
    }

    setInterval(function(){
      var badge = document.querySelector('.auto-count-badge.svelte-148rkou, .auto-count-badge');
      var badgeText = badge ? (badge.textContent || '').trim() : '';
      var autoActive = visible(badge) && !!badgeText;
      var spinBtn = document.querySelector('.spin-btn.svelte-148rkou, .spin-btn');
      var locked = !!(spinBtn && (spinBtn.disabled || spinBtn.classList.contains('disabled')));
      var heldAutoLock = Date.now() < (window.__wvzAutoLockUntil || 0);
      document.body.classList.toggle('wvz-spin-locked', locked || autoActive || heldAutoLock);
      if (autoActive) {
        window.__wvzAutoLockUntil = Date.now() + 6500;
        document.body.classList.add('wvz-autospin-active');
      } else {
        document.body.classList.toggle('wvz-autospin-active', heldAutoLock);
      }

      var win = document.querySelector('.stats-panel.svelte-148rkou .win-center.svelte-148rkou .stat-value.svelte-148rkou, .stats-panel.svelte-148rkou .win-center.svelte-148rkou .win-font-size.svelte-148rkou');
      var raw = win ? (win.textContent || '') : '';
      var num = Number(raw.replace(/[^0-9.-]/g, ''));
      var live = isFinite(num) && Math.abs(num) > 0.000001;
      document.body.classList.toggle('wvz-base-win-live', live);
      document.body.classList.toggle('wvz-base-win-zero', !live);
    }, 80);
  })();
